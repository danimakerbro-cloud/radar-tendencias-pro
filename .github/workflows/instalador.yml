# Crea el instalador de Windows, lo prueba y lo sube a la versión (Release) que publiques en GitHub.
# Para sacar una versión: pestaña Releases → "Draft a new release" → etiqueta nueva (ej. v1.2.0) → Publish.
# Subir a la rama "prueba" compila y prueba todo sin publicar nada.
# Subir a la rama "publicar" compila, prueba y publica la versión que diga APP_VERSION en motor.py.
name: Crear instalador

on:
  release:
    types: [published]
  push:
    branches: [prueba, publicar]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Poner el número de versión
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $v = "${{ github.event.release.tag_name }}".TrimStart("v")
            $texto = Get-Content motor.py -Raw -Encoding utf8
            $texto = $texto -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$v`""
            [System.IO.File]::WriteAllText("$PWD\motor.py", $texto, (New-Object System.Text.UTF8Encoding $false))
          } else {
            $v = (Select-String -Path motor.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Revisar que el código cargue
        run: python -c "import motor, analisis, servidor, app; print(motor.APP_NOMBRE, motor.APP_VERSION)"

      - name: Crear el programa
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name RadarTendenciasPro --icon radar.ico
          --add-data "radar.ico;." --add-data "ui;ui"
          app.py

      - name: "Prueba 1: el programa analiza un mercado con internet real"
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\RadarTendenciasPro\RadarTendenciasPro.exe" -ArgumentList "--prueba", "$PWD\prueba.json" -PassThru -Wait
          $r = Get-Content prueba.json -Raw -Encoding utf8
          Write-Host $r
          $c = ($r | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 6)
          if ($c.Length -gt 3800) { $c = $c.Substring(0, 3800) }
          Write-Host "::notice title=Prueba analisis::$c"
          if ($p.ExitCode -ne 0) { Write-Host "::error::La prueba del análisis falló"; exit 1 }

      - name: "Prueba 2: la ventana abre y muestra la interfaz"
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\RadarTendenciasPro\RadarTendenciasPro.exe" -ArgumentList "--prueba-ventana", "$PWD\ventana.json" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "::warning title=Prueba ventana::No cerró a tiempo" }
          if (Test-Path ventana.json) { $r = Get-Content ventana.json -Raw -Encoding utf8; Write-Host "::notice title=Prueba ventana::$r" } else { Write-Host "::warning title=Prueba ventana::Sin resultado" }

      - name: Conseguir Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Crear el instalador
        shell: pwsh
        run: |
          & $env:ISCC "/DMyAppVersion=${{ steps.ver.outputs.version }}" "instalador\RadarTendenciasPro.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Crear la versión portátil (.zip)
        shell: pwsh
        run: |
          Copy-Item ejemplo_ventas.csv, LEEME.txt dist\RadarTendenciasPro\
          Compress-Archive -Path dist\RadarTendenciasPro\* -DestinationPath salida\RadarTendenciasPro-Portable.zip -Force
          Get-ChildItem salida | Format-Table Name, Length

      - name: Guardar archivos de esta compilación
        uses: actions/upload-artifact@v5
        with:
          name: RadarTendenciasPro-${{ steps.ver.outputs.version }}
          path: salida/*

      - name: Publicar la versión en GitHub
        if: github.event_name == 'release' || github.ref_name == 'publicar'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Radar de Tendencias Pro ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            **Para instalar:** descarga `RadarTendenciasPro-Setup.exe` y ábrelo. Si Windows muestra «Windows protegió su PC», da clic en *Más información* → *Ejecutar de todas formas*.
            **Sin instalar:** descarga `RadarTendenciasPro-Portable.zip`, descomprímelo y abre `RadarTendenciasPro.exe`.
          files: |
            salida/RadarTendenciasPro-Setup.exe
            salida/RadarTendenciasPro-Portable.zip
